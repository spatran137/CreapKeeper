name: Build and publish release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (example: v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Install executable builder
        run: python -m pip install 'pyinstaller>=6.15,<7' -r requirements-gui.txt
      - name: Package standalone Windows app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-submodules pystray --add-data "Counter/web/index.html;web" --name Counter Counter/Counter.py
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version || 'v1.1.0' }}
        run: |
          $version = $env:RELEASE_VERSION
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid version: $version" }
          $existing = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing GitHub releases.' }
          if ($existing | Where-Object { $_.tagName -eq $version }) {
            Write-Host "Release $version already exists; not publishing twice."
            exit 0
          }
          if (-not (Test-Path 'dist/Counter.exe')) { throw 'Missing Counter.exe build artifact.' }
          $args = @('release', 'create', $version, 'dist/Counter.exe', '--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA, '--title', "Counter $version - Office Encounter Tracker", '--latest')
          $notes = "docs/releases/$version.md"
          if (Test-Path $notes) {
            $args += @('--notes-file', $notes)
          } else {
            $args += '--generate-notes'
          }
          gh @args
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub release $version." }
